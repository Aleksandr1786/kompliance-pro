name: Проверка качества desktop

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: desktop-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Получить код
        uses: actions/checkout@v6

      - name: Установить Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Установить зависимости и проверить устаревшие пакеты
        shell: pwsh
        env:
          NO_COLOR: '1'
          npm_config_color: 'false'
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'npm-ci.log'
          npm ci 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          node scripts/check-dependency-deprecations.js $log

      - name: Проверить код и контракт синхронизации
        run: npm run check

      - name: Проверить запуск Electron и навигацию
        run: npm run smoke:desktop

      - name: Проверить runtime-зависимости
        run: npm audit --omit=dev --audit-level=high

      - name: Проверить полный dependency-граф
        run: npm audit --audit-level=high
