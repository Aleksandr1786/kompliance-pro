name: Проверка качества desktop

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: desktop-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Установить зависимости
        run: npm ci

      - name: Проверить код и контракт синхронизации
        run: npm run check
